[project]
name = "group-pay"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.148.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.2",
    "pytest==9.0.3",
    "ty==0.0.18",
    "httpx2==2.14.0",
]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
target-version = "py315"
